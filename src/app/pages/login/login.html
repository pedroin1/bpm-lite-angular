<div class="login">
  <div class="login__box">
    <img
      class="login__logo"
      src="/assets/images/logo.png"
      height="150px"
      width="500px"
      alt="Logo"
    />
    <form [formGroup]="form()" class="login__form">
      <app-input
        label="Email"
        placeholder="Digite seu email"
        [control]="this.form().controls.email"
        [errorMessages]="errorMessages.email"
      ></app-input
      ><app-input
        label="Senha"
        placeholder="***********"
        type="password"
        [maxLength]="passwordMaxLength"
        [control]="this.form().controls.password"
        [errorMessages]="errorMessages.password"
      ></app-input>
      <button class="login__button">Entrar</button>
      <a class="login__forgot-password" routerLink="/forgot-password">Esqueci minha senha</a>
    </form>
  </div>
</div>
