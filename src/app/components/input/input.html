<mat-form-field appearance="outline">
  <mat-label class="input__label">
    {{ label() }}
  </mat-label>

  <input
    matInput
    [type]="type()"
    [placeholder]="placeholder()"
    [formControl]="control()"
    [attr.maxlength]="maxLength()"
    [attr.minlength]="minLength()"
  />

  @if (control().errors && control().touched) {
    <mat-error>
      {{ getErrorMessage() }}
    </mat-error>
  }
</mat-form-field>
